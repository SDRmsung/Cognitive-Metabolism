[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-metabolism"
version = "0.1.0"
description = "A Dynamic Epistemological & Graph-Theoretic Engine for Enterprise Knowledge Health, Structural Entropy Reduction, and Agentic Memory Governance"
readme = "README.md"
authors = [
  { name = "Ming-Hung Sung", email = "research@ai-triz.org" },
  { name = "Shih-Yu Sung", email = "shihyu0326@gmail.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
cm-audit = "cognitive_metabolism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
